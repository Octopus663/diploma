; PHP-FPM пул. Кількість процесів задається тут і фіксується в bench/config.md
; після калібрування (етап 4).
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = static
pm.max_children = 8
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
